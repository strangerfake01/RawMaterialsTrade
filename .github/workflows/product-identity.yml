name: Product identity regression

on:
  pull_request:
    paths:
      - 'products-multilingual.json'
      - 'en-*.html'
      - 'hu-*.html'
      - 'de-at-*.html'
      - 'scripts/check-related-product-identity.py'
      - 'scripts/check-product-substitutions.py'
      - 'product-substitutions.json'
      - 'schemas/product-substitution.schema.json'
      - '.github/workflows/product-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  related-product-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify linked product chemical identity (EN/HU/DE)
        run: python3 scripts/check-related-product-identity.py
      - name: Verify evidence-backed substitution registry
        run: python3 scripts/check-product-substitutions.py
