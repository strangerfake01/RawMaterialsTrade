name: Confidential Git history audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-restricted-file-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit reachable Git history without printing file contents
        run: python3 scripts/audit-confidential-git-history.py
