name: Product master sync and OpenAI review

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: product-master-sync
  cancel-in-progress: false

jobs:
  sync-review-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: product-master-release
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl cryptography

      - name: Download product master from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_DRIVE_FILE_ID"
          python scripts/download_drive_workbook.py "$GOOGLE_SERVICE_ACCOUNT_JSON" "$GOOGLE_DRIVE_FILE_ID" work/product-master.xlsx

      - name: Build redacted change manifest
        run: python scripts/product_master_change_manifest.py work/product-master.xlsx work/change-manifest.json

      - name: OpenAI agent review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/openai_product_master_review.py work/change-manifest.json

      - name: Apply only explicitly approved, source-backed changes
        run: python scripts/apply_approved_product_master_changes.py work/product-master.xlsx work/openai-review.json

      - name: Run release gates
        run: |
          python tools/audit_release_contract.py
          python scripts/check_product_parity.py
          python tools/audit_public_privacy.py
          python tools/audit_public_chemical_identity.py
          python tools/audit_chemical_source_integrity.py
          python tools/audit_ai_claim_contract.py
          python tools/audit_product_alternatives.py
          python tools/audit_internal_links.py

      - name: Commit and push approved release
        run: |
          git config user.name "product-master-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-multilingual.json products-hu.json products-de-at.json '*.html' entity-registry.json reports HANDOFF
          git diff --cached --quiet && echo "No approved site changes" && exit 0
          git commit -m "chore: sync approved product master changes"
          git push origin main

