name: Apply chemical source integrity remediation
on:
  push:
    branches: [fix/chemical-source-integrity-20261108]
    paths:
      - 'tools/remediate_chemical_sources.py'
      - 'tools/remove_unverified_sameas.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove unapproved ChemicalSubstance sameAs
        run: python3 tools/remove_unverified_sameas.py
      - name: Re-run V3 release audit
        run: python3 tools/audit_release_contract.py
      - name: Re-run static asset audit
        run: python3 tools/audit_static_assets.py
      - name: Confirm no unverified PubChem formula claims remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          docs = [p for p in Path('.').glob('*.html') if re.match(r'^(en|hu|de-at)-.*-(industrial|food|feed|deicing)\.html$', p.name)]
          broken = [p.name for p in docs if re.search(r'PubChem (?:reports|formula check|:)', p.read_text(encoding='utf-8'))]
          print(f'Checked {len(docs)} product pages; remaining unsafe PubChem formula claims: {len(broken)}')
          if broken:
              raise SystemExit(str(broken[:15]))
          PY
      - name: Commit verified changes back to repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'HANDOFF/SAMEAS-REMEDIATION.md'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: withhold unverified ChemicalSubstance sameAs links'
            git push origin HEAD:fix/chemical-source-integrity-20261108
          fi
