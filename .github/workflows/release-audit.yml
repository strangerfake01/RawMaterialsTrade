name: Static release contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked public files for private correspondence and credentials
        run: python3 tools/audit_public_privacy.py
      - name: Check shared JavaScript syntax
        run: |
          node --check assets/js/site.v20261108.js
          node --check assets/js/analytics-consent.v20260713.js
      - name: Check local CSS, JS, images and media
        run: python3 tools/audit_static_assets.py
      - name: Validate sitemap, canonicals, hreflang, JSON-LD and product content
        run: python3 tools/audit_release_contract.py
      - name: Reject unverified chemical identity source claims
        run: python3 tools/audit_chemical_source_integrity.py
      - name: Check all same-origin anchor targets and certificates
        run: python3 tools/audit_internal_links.py
      - name: Check transparent evidence-based product-depth inventory
        run: python3 tools/audit_product_evidence_depth.py --check
      - name: Check multilingual AI-facing claims against catalogue evidence
        run: python3 tools/audit_ai_claim_contract.py
      - name: Prevent unreviewed chemical identity claims in 378 product schemas
        run: python3 tools/audit_public_chemical_identity.py
      - name: Enforce batch-specific CoA caveats on 378 multilingual pages
        run: python3 tools/audit_supplier_coa_status.py
      - name: Inventory unsupported packaging, concentration and document promises
        run: python3 tools/audit_public_product_claims.py
      - name: Inventory ambiguous technical concentration and form fields
        run: python3 tools/audit_technical_field_semantics.py
