name: Static release contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked public files for private correspondence and credentials
        run: python3 tools/audit_public_privacy.py
      - name: Check shared JavaScript syntax
        run: |
          node --check assets/js/site.v20261108.js
          node --check assets/js/analytics-consent.v20260713.js
      - name: Check local CSS, JS, images and media
        run: python3 tools/audit_static_assets.py
      - name: Validate sitemap, canonicals, hreflang, JSON-LD and product content
        run: python3 tools/audit_release_contract.py
      - name: Ensure EN HU DE homepage product count matches the canonical product catalogue
        run: python3 tools/audit_homepage_catalogue_count.py
      - name: Enforce registered office and operational-site parity across EN HU DE
        run: python3 tools/audit_registered_office_parity.py
      - name: Verify three-language manufacturer partnership qualification intent
        run: python3 tools/audit_manufacturer_intent.py
      - name: Audit all indexed SEO AEO metadata and HTML/sitemap hreflang parity
        run: python3 tools/audit_search_surface.py
      - name: Guard 3L privacy consent withdrawal and preconsent analytics loading
        run: python3 tools/audit_consent_source.py
      - name: Exercise consent opt-in reject reopen and withdrawal state transitions
        run: node tests/analytics-consent-runtime.cjs
      - name: Verify separate buyer and manufacturer lead intent analytics boundaries
        run: python3 tools/audit_lead_audience.py
      - name: Require no-JavaScript three-language privacy links on all 381 product routes
        run: python3 tools/ensure_product_privacy_links.py
      - name: Compile exact-live verifier without fetching production
        run: python3 -m py_compile tools/verify_live_release.py
      - name: Run offline fail-closed exact-live release verifier regression
        run: python3 tools/test_verify_live_release.py
      - name: Prevent copper oxide and zinc chloride chemical content cross-contamination
        run: python3 tools/audit_copper_oxide_evidence_boundary.py
      - name: Reject unverified chemical identity source claims
        run: python3 tools/audit_chemical_source_integrity.py
      - name: Check all same-origin anchor targets and certificates
        run: python3 tools/audit_internal_links.py
      - name: Check transparent evidence-based product-depth inventory
        run: python3 tools/audit_product_evidence_depth.py --check
      - name: Check multilingual AI-facing claims against catalogue evidence
        run: python3 tools/audit_ai_claim_contract.py
      - name: Check three-language B2B procurement journey and quotation requirements
        run: python3 tools/audit_procurement_journey.py
      - name: Check buyer and supplier paths across all localized product pages
        run: python3 tools/audit_product_procurement_paths.py
      - name: Audit all localized chemical search landing-page identities
        run: python3 tools/audit_chemical_search_landing.py
      - name: Check multilingual product alternative links
        run: python3 tools/audit_product_alternatives.py
      - name: Audit Wikidata and multilingual Wikipedia candidate coverage
        run: python3 tools/audit_wikidata_wikipedia_coverage.py
      - name: Prevent unreviewed chemical identity claims in all product schemas
        run: python3 tools/audit_public_chemical_identity.py
      - name: Enforce batch-specific CoA caveats on all localized product pages
        run: python3 tools/audit_supplier_coa_status.py
      - name: Block unverified supplier packaging, SDS TDS CoA claims in all 381 product pages and public JSON feeds
        run: python3 tools/defer_unverified_supplier_claims.py
      - name: Inventory unsupported packaging, concentration and document promises
        run: python3 tools/audit_public_product_claims.py
      - name: Inventory ambiguous technical concentration and form fields
        run: python3 tools/audit_technical_field_semantics.py
