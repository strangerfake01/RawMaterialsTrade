name: Full sitemap responsive browser smoke

on:
  pull_request:
    paths:
      - "**.html"
      - "sitemap.xml"
      - "assets/css/**"
      - "assets/js/**"
      - "tools/test_responsive_route_browser.cjs"
      - ".github/workflows/responsive-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Start isolated localhost static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rmt-layout-http.log 2>&1 &
          echo $! > /tmp/rmt-layout-http.pid
      - name: Render all sitemap URLs at mobile and desktop widths and priority routes at additional widths
        run: node tools/test_responsive_route_browser.cjs
